# Copy into an app's .github/workflows/ to keep its prompt-this-spot dependency
# up to date.
#
# It follows whichever way the app depends on the package:
#   "@brotskyllc/prompt-this-spot": "1.2.3"   -> the newest version published to npm
#   "@brotskyllc/prompt-this-spot": "github:AEGIS-Security-Investigations/prompt-this-spot#<sha>"
#                                 -> the newest commit on main
#
# It only ever moves the dependency forward. If the app is pinned to a commit
# that is not on main (a feature-branch commit), or to a version newer than npm
# "latest", the workflow leaves the pin alone; for a commit it fails so the
# pin gets fixed, because a branch commit can disappear when the branch is
# deleted and every install of it then breaks.
#
# When there is something newer, this updates package.json and the lockfile and
# opens (or refreshes) one pull request listing the changes it brings in.
#
# Pull requests opened with the default GITHUB_TOKEN do not start other
# workflows, so the app's CI will not run on them by itself. Set a
# PROMPT_THIS_SPOT_PR_TOKEN secret (a token that can push branches and open
# pull requests) if CI should run automatically; otherwise push an empty
# change or re-run CI from the PR.

name: Update prompt-this-spot

on:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [prompt-this-spot-updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-prompt-this-spot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PACKAGE: "@brotskyllc/prompt-this-spot"
      SOURCE_REPO: AEGIS-Security-Investigations/prompt-this-spot
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Find the newest version
        id: versions
        run: |
          spec="$(jq -r --arg p "$PACKAGE" '.dependencies[$p] // .devDependencies[$p] // ""' package.json)"
          if [ -z "$spec" ]; then
            echo "::error::$PACKAGE is not in package.json."
            exit 1
          fi
          api() {
            curl -sS --fail-with-body -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$SOURCE_REPO/$1"
          }
          case "$spec" in
            github:*)
              # Pinned to a commit: follow the source repository's main branch.
              mode=git
              current="${spec##*#}"
              latest="$(git ls-remote "https://github.com/$SOURCE_REPO" refs/heads/main | cut -f1)"
              if [ -z "$latest" ]; then
                echo "::error::Could not read the main branch of $SOURCE_REPO."
                exit 1
              fi
              if [ "$latest" != "$current" ]; then
                # Only ever move forward. A pin to a commit that is not on main
                # (a feature-branch commit) or is ahead of main must not be
                # replaced with an older main: that silently undoes a fix.
                if ! compare="$(api "compare/$current...$latest")"; then
                  echo "::error::$PACKAGE is pinned to $current, which $SOURCE_REPO does not have (a deleted branch?). Installs of that pin will break. Pin a commit on main."
                  exit 1
                fi
                status="$(printf '%s' "$compare" | jq -r '.status')"
                if [ "$status" != "ahead" ]; then
                  echo "::error::$PACKAGE is pinned to $current, which is not on $SOURCE_REPO main (compare status: $status). Merge that change to main and pin the merged commit; this workflow will not overwrite the pin."
                  exit 1
                fi
              fi
              ;;
            *)
              # Pinned to a published version: follow the npm "latest" tag.
              mode=npm
              current="$(printf '%s' "$spec" | sed 's/^[~^=v]*//')"
              latest="$(npm view "$PACKAGE" version)"
              if [ -z "$latest" ]; then
                echo "::error::Could not read the latest $PACKAGE version from npm."
                exit 1
              fi
              # SemVer precedence, not sort -V: 1.0.0-alpha comes before 1.0.0.
              if ! order="$(CURRENT="$current" LATEST="$latest" \
                bun -e 'console.log(Bun.semver.order(process.env.LATEST, process.env.CURRENT))')"; then
                echo "::error::Could not compare $PACKAGE versions \"$current\" and \"$latest\" as SemVer."
                exit 1
              fi
              if [ "$order" = "-1" ]; then
                echo "$PACKAGE $current is newer than npm latest $latest; leaving it alone."
                latest="$current"
              fi
              ;;
          esac
          {
            echo "mode=$mode"
            echo "latest=$latest"
            echo "current=$current"
          } >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on $current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Updating $current -> $latest."
          fi

      - name: Update the dependency and lockfile
        if: steps.versions.outputs.changed == 'true'
        env:
          MODE: ${{ steps.versions.outputs.mode }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          if [ "$MODE" = git ]; then
            spec="github:$SOURCE_REPO#$LATEST"
          else
            spec="$LATEST"
          fi
          tmp="$(mktemp)"
          jq --indent 2 --arg p "$PACKAGE" --arg v "$spec" \
            'if .dependencies[$p] then .dependencies[$p] = $v else .devDependencies[$p] = $v end' \
            package.json > "$tmp"
          mv "$tmp" package.json
          bun install --ignore-scripts

      - name: List the incoming changes
        if: steps.versions.outputs.changed == 'true'
        env:
          MODE: ${{ steps.versions.outputs.mode }}
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          if [ "$MODE" = git ]; then
            from="$CURRENT"
            to="$LATEST"
            title="[\`${LATEST:0:7}\`](https://github.com/$SOURCE_REPO/commit/$LATEST)"
          else
            from="v$CURRENT"
            to="v$LATEST"
            title="[\`$LATEST\`](https://github.com/$SOURCE_REPO/releases/tag/v$LATEST)"
          fi
          {
            echo "Updates \`$PACKAGE\` to $title."
            echo
            if [ -n "$CURRENT" ]; then
              echo "Changes since \`$from\` ([full diff](https://github.com/$SOURCE_REPO/compare/$from...$to)):"
              echo
              curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$SOURCE_REPO/compare/$from...$to" \
                | jq -r '.commits[]? | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"'
            fi
            echo
            echo "Opened by the Update prompt-this-spot workflow."
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open or refresh the pull request
        if: steps.versions.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PROMPT_THIS_SPOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/update-prompt-this-spot
          delete-branch: true
          commit-message: "chore: update prompt-this-spot to ${{ steps.versions.outputs.latest }}"
          title: "chore: update prompt-this-spot"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: dependencies
