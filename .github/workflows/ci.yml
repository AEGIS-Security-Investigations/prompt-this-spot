name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Prebuilt stylesheet is up to date
        run: bun run build:css && git diff --exit-code -- styles

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # What `npm publish` would upload: allowlisted files only, no secrets, and a
  # dry-run publish that uploads nothing.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check:package
      - run: npm publish --dry-run --provenance=false

  # Install the packed tarball into a fresh Next.js app and build it, at the
  # versions the consuming apps run.
  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - next: 16.3.3
            react: 19.2.5
            typescript: 6.0.3
            lucide: 1.11.0
          - next: 16.2.0-canary.0
            react: 19.2.8
            typescript: 5.9.3
            lucide: 0.556.0
    name: consumer (next ${{ matrix.next }}, react ${{ matrix.react }}, ts ${{ matrix.typescript }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun run test:consumer
        env:
          NEXT_VERSION: ${{ matrix.next }}
          REACT_VERSION: ${{ matrix.react }}
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}
          LUCIDE_VERSION: ${{ matrix.lucide }}
