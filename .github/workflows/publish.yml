name: Publish to npm

# Publishes the package to npm whenever main carries a version that npm does
# not have yet, tags the commit v<version>, creates a GitHub release, and then
# asks the consumer apps to update.
#
# Nothing is published unless the repository variable NPM_PUBLISH is "true"
# and the run is on main, the reviewed release branch. That holds for every
# trigger, including a manual run. A manual run is a dry run by default: it
# audits the tarball and runs `npm publish --dry-run`, which uploads nothing.
# Publishing for real by hand needs NPM_PUBLISH set, a run on main AND the
# "publish" input ticked; a manual run from any other branch is a dry run.
#
# Publishing uses npm trusted publishing (OIDC): on npmjs.com, add this
# repository and "publish.yml" as a trusted publisher for the package. An
# NPM_TOKEN secret (an automation token) works too.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "styles/**"
      - "package.json"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish for real (also needs the NPM_PUBLISH variable and a run on main). Unticked = dry run."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # A push only does anything once publishing is switched on; a manual run
    # always runs, but see `real` below.
    if: vars.NPM_PUBLISH == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.mode.outputs.real == 'true' && steps.version.outputs.status == 'unpublished' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing (11.5.1+)
        run: npm install -g npm@latest

      # See scripts/lib/publishMode.ts: a real publish needs NPM_PUBLISH,
      # the reviewed main branch, and a push or a ticked "publish" input.
      - name: Real publish or dry run?
        id: mode
        env:
          ENABLED: ${{ vars.NPM_PUBLISH == 'true' }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUESTED: ${{ inputs.publish == true }}
        run: bun scripts/publish-mode.ts

      # Fails the job unless the registry gives a validated answer for this
      # exact package (scripts/lib/npmVersionStatus.ts).
      - name: Is this version on npm yet?
        id: version
        run: |
          status="$(bun scripts/npm-version-status.ts)" || exit 1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "$(jq -r '.name + "@" + .version' package.json) is $status."

      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Prebuilt stylesheet is up to date
        run: bun run build:css && git diff --exit-code -- styles
      - name: Audit the packed tarball
        run: bun run check:package
      - name: npm publish --dry-run
        run: npm publish --dry-run --provenance=false

      - name: Publish
        if: steps.mode.outputs.real == 'true' && steps.version.outputs.status == 'unpublished' && github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Tag and release
        if: steps.mode.outputs.real == 'true' && steps.version.outputs.status == 'unpublished' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(jq -r .version package.json)"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file <(
            awk -v v="## $(jq -r .version package.json)" '$0 ~ "^## " {p = index($0, v) == 1} p' CHANGELOG.md
          )

  notify:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/notify-consumers.yml
    secrets: inherit
