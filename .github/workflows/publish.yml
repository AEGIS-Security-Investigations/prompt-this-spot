name: Publish to npm

# Publishes the package to npm whenever main carries a version that npm does
# not have yet, tags the commit v<version>, creates a GitHub release, and then
# asks the consumer apps to update.
#
# Turn it on by setting the repository variable NPM_PUBLISH to "true" once the
# package can be published. Publishing uses npm trusted publishing (OIDC): on
# npmjs.com, add this repository and "publish.yml" as a trusted publisher for
# the package. An NPM_TOKEN secret (an automation token) works too and is
# needed for the very first publish if the package does not exist on npm yet.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "styles/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NPM_PUBLISH == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing (11.5.1+)
        run: npm install -g npm@latest

      - name: Is this version on npm yet?
        id: version
        run: |
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $name@$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: bun run check
      - name: Prebuilt stylesheet is up to date
        if: steps.version.outputs.publish == 'true'
        run: bun run build:css && git diff --exit-code -- styles

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Tag and release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  notify:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/notify-consumers.yml
    secrets: inherit
